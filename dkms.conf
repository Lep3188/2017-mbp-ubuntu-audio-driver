PACKAGE_NAME="mbp143-audio"
PACKAGE_VERSION="1.0.0"

# PRE_BUILD prepares a private copy of the kernel's sound/hda tree inside the
# DKMS build directory; MAKE then compiles only the CS8409 codec from it.
PRE_BUILD="bash scripts/dkms-prepare.sh $kernelver"
MAKE[0]="bash scripts/dkms-make.sh $kernelver"
CLEAN="bash scripts/dkms-clean.sh $kernelver"

BUILT_MODULE_NAME[0]="snd-hda-codec-cs8409"
BUILT_MODULE_LOCATION[0]="build/hda/codecs/cirrus"
DEST_MODULE_LOCATION[0]="/updates"

AUTOINSTALL="yes"
